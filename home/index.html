  <title>Videy - Free and Simple Video Hosting</title>

  <!-- 🔥 DETEKSI AWAL (anti navbar muncul) -->
  <script>
    const hasVideo = new URLSearchParams(window.location.search).get("id");

      document.documentElement.classList.add("watch-mode");

  </script>

  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0.1px; /* Mencegah margin collapse */
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      width: 100%;
      height: 100%;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
    }
    .logo {
      font-weight: bold;
      font-size: 20px;
    }
    .nav-right a {
      margin-left: 20px;
      text-decoration: none;
      color: #000;
    }
    .upload-btn {
      background: #111827;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
    }

    /* HERO */
    .hero {
      text-align: center;
      margin-top: 120px;
    }
    .hero h1 {
      font-size: 48px;
      margin: 0;
    }
    .hero h2 {
      font-size: 40px;
      color: #6b7280;
      margin: 0;
    }
    .hero p {
      margin-top: 20px;
      color: #6b7280;
    }
    .hero button {
      margin-top: 30px;
      padding: 12px 24px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
    }

    /* PLAYER */
    .plyr-container {
      display: none;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      background: black;
    }
    .plyr-container video {
      max-width: 100%;
      max-height: 100%;
    }

    /* ERROR */
    .error-container {
      color: white;
      text-align: center;
      background: black;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* 🔥 WATCH MODE (kalau ada ?id=) */
    .watch-mode .navbar, 
    .watch-mode .hero {
      display: none !important;
    }
    .watch-mode body, 
    .watch-mode html {
      background: black;
      overflow: hidden;
    }
    .watch-mode .plyr-container {
      display: flex !important;
    }
  </style>

  <link rel="me" href="https://www.blogger.com/profile/08349335569668208117" />
  <meta name='google-adsense-platform-account' content='ca-host-pub-1556223355139109'/>

</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">videy</div>
    <div class="nav-right">
      <a href="#">Sign Up</a>
      <a href="#" class="upload-btn">Upload</a>
    </div>
  </div>

  <!-- HERO -->
  <div class="hero">
    <h1>Upload your videos</h1>
    <h2>and share</h2>
    <p>Free and simple video hosting.</p>
    <button>Upload Video</button>
  </div>

  <!-- PLAYER -->
  <div class="plyr-container">
    <!-- 1. Perbaikan: Menambahkan atribut 'muted' langsung pada tag video -->
    <video id="player" playsinline controls muted>
      <source id="videoSource" src="" type="video/mp4">
    </video>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      if (!id) return;

      // Validasi ID alfanumerik
      if (!/^[a-zA-Z0-9]+$/.test(id)) {
        document.body.innerHTML = '<div class="error-container"><h2>Video tidak ditemukan</h2></div>';
        return;
      }

      const videoUrl = "https://cdn2.slicedrive.com/" + id + ".mp4";
      const source = document.getElementById("videoSource");
      const video = document.getElementById("player");

      source.src = videoUrl;

      video.onerror = function () {
        document.body.innerHTML = '<div class="error-container"><h2>Video gagal dimuat</h2><p>Cek ID atau server.</p></div>';
      };

      video.load();
      try {
        // 2. Perbaikan: Memaksa konfigurasi Plyr agar membaca state video dalam kondisi mute sejak awal
        new Plyr(video, {
          muted: true,
          volume: 0
        });
      } catch (e) {
        console.error("Gagal menginisialisasi Plyr:", e);
      }
    });
  </script>
<script>

}();
</script>
